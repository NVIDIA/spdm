# gcovr configuration file
# Exclude specific directories from coverage computation

# Exclude test directories
exclude = .*/tests/.*

# Exclude spdmutil directory
exclude = .*/spdmutil/.*

# Exclude fuzzer directory
exclude = .*/fuzzer/.*

# Exclude subprojects directory
exclude = .*/subprojects/.*

# Exclude tools directory
exclude = .*/tools/.*

# Also exclude test and mock files anywhere
exclude = .*/test_.*
exclude = .*/mock_.*

html = yes
print-summary = yes
